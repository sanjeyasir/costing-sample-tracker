<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Rounded branding backdrop -->
  <rect width="120" height="120" rx="28" fill="#10b981" />
  
  <g transform="translate(60, 60)">
    <!-- Operations Gear Structure -->
    <!-- 8 Gear Teeth -->
    <g stroke="#ffffff" stroke-width="12" stroke-linecap="round">
      <line x1="0" y1="-42" x2="0" y2="42" />
      <line x1="-42" y1="0" x2="42" y2="0" />
      <line x1="-30" y1="-30" x2="30" y2="30" />
      <line x1="-30" y1="30" x2="30" y2="-30" />
    </g>
    
    <!-- Outer Gear Ring -->
    <circle cx="0" cy="0" r="32" fill="#10b981" stroke="#ffffff" stroke-width="8" />
    
    <!-- Inner Gear Hub Hole -->
    <circle cx="0" cy="0" r="16" fill="#10b981" />
    
    <!-- Natural Leaf/Fiber branch sprouting through the gear center -->
    <path d="M-8,14 C-8,2 2,-10 16,-18 C10,-4 -1,-1 -8,14 Z" fill="#ffffff" />
    <path d="M-2,2 C1,-6 10,-10 14,-14 C10,-8 2,-4 -2,2 Z" fill="#ffffff" />
  </g>
</svg>